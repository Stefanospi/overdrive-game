name = "overdrive-board"
main = "index.js"
compatibility_date = "2025-01-01"

# Create the namespace once:  npx wrangler kv namespace create BOARD
# and paste the id it prints below.
[[kv_namespaces]]
binding = "BOARD"
id = "PASTE_KV_NAMESPACE_ID"

[vars]
# Public URL of the game (GitHub Pages origin), so only your site can post.
ALLOWED_ORIGIN = "*"
